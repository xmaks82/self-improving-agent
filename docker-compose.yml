services:
  agent:
    build: .
    container_name: self-improving-agent
    stdin_open: true    # For interactive CLI
    tty: true           # For interactive CLI
    environment:
      # Required: at least one API key
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Optional: for more models
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - SAMBANOVA_API_KEY=${SAMBANOVA_API_KEY:-}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      # Optional: for Anthropic models and LLM fallback in feedback detection
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Model configuration (match the code default; override in .env)
      - DEFAULT_MODEL=${DEFAULT_MODEL:-fcm}
      - ANALYZER_MODEL=${ANALYZER_MODEL:-fcm}
      - VERSIONER_MODEL=${VERSIONER_MODEL:-fcm}
      - FEEDBACK_MODEL=${FEEDBACK_MODEL:-llama-4-scout}
      # Thresholds
      - FEEDBACK_CONFIDENCE_THRESHOLD=${FEEDBACK_CONFIDENCE_THRESHOLD:-0.8}
      - IMPROVEMENT_CONFIDENCE_THRESHOLD=${IMPROVEMENT_CONFIDENCE_THRESHOLD:-0.6}
      # Optional: hybrid memory (vector + keyword). Unset → keyword-only.
      # Point at your own OpenAI-compatible /v1/embeddings endpoint via .env.
      - EMBEDDINGS_URL=${EMBEDDINGS_URL:-}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-default}
      - EMBEDDINGS_TIMEOUT=${EMBEDDINGS_TIMEOUT:-10}
      - EMBEDDINGS_ENABLED=${EMBEDDINGS_ENABLED:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Reach host-published services (e.g. a local embeddings server) from the
    # container via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist all data
      - ./data/prompts:/app/data/prompts
      - ./data/logs:/app/data/logs
      - ./data/tasks:/app/data/tasks
      - ./data/memory:/app/data/memory
      - ./data/undo:/app/data/undo
    restart: unless-stopped
